# Gera o APK do app Operação Vectra na nuvem, sem instalar nada no computador.
# Depois de editar o SERVER_URL abaixo: Actions > Build APK > Run workflow.
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  # >>> TROQUE PELO ENDEREÇO DO SISTEMA <<<
  # Rede interna:  http://IP-DO-SERVIDOR:8503
  # Na nuvem:      https://operacao-vectra.onrender.com
  SERVER_URL: "http://192.168.34.17:8503"
  APP_ID: "br.com.vectrawork.operacao"
  APP_NAME: "Operacao Vectra"

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Aceitar licencas do Android SDK
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Montar o projeto
        run: |
          mkdir -p www
          cp -f error.html www/ 2>/dev/null || true
          echo '<!doctype html><meta charset="utf-8"><title>Operacao</title><body>Conectando...</body>' > www/index.html
          cat > package.json <<'FIM'
          {
            "name": "operacao-vectra",
            "version": "1.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^6.2.0",
              "@capacitor/core": "^6.2.0",
              "@capacitor/local-notifications": "^6.1.0"
            },
            "devDependencies": { "@capacitor/cli": "^6.2.0" }
          }
          FIM
          cat > capacitor.config.json <<FIM
          {
            "appId": "${APP_ID}",
            "appName": "${APP_NAME}",
            "webDir": "www",
            "server": { "url": "${SERVER_URL}", "cleartext": true, "errorPath": "error.html" },
            "android": { "allowMixedContent": true }
          }
          FIM
          cat capacitor.config.json

      - name: Instalar dependencias
        run: npm install

      - name: Montar projeto Android
        run: npx cap add android

      - name: Aplicar o icone da Vectra
        run: |
          RES=android/app/src/main/res
          cp -rf icones/mipmap-* $RES/
          cp -f icones/values/ic_launcher_background.xml $RES/values/
          ls $RES/mipmap-anydpi-v26 $RES/mipmap-xxxhdpi

      - name: Gerar APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: operacao-vectra-apk
          path: android/app/build/outputs/apk/debug/*.apk
